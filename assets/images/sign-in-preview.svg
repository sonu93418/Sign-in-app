<svg width="1200" height="2400" viewBox="0 0 1200 2400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F7F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="2400" fill="url(#bg)"/>

  <!-- MacBook frame -->
  <g transform="translate(88 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="1024" height="2280" rx="42" fill="#F6F6F6"/>
    <rect x="26" y="26" width="972" height="2228" rx="34" fill="#FFFFFF"/>

    <!-- title bar -->
    <rect x="26" y="26" width="972" height="118" rx="34" fill="#FAFAFA"/>
    <circle cx="78" cy="85" r="12" fill="#FF5F57"/>
    <circle cx="112" cy="85" r="12" fill="#FEBC2E"/>
    <circle cx="146" cy="85" r="12" fill="#28C840"/>
    <text x="200" y="94" font-family="Inter, Arial, sans-serif" font-size="34" fill="#111111" font-weight="500">index</text>

    <!-- settings button -->
    <circle cx="910" cy="86" r="64" fill="#1F83FF" opacity="0.20"/>
    <circle cx="910" cy="86" r="56" fill="#1F83FF"/>
    <path d="M910 54L919 60L929 58L937 67L935 77L941 86L935 95L937 105L929 114L919 112L910 118L901 112L891 114L883 105L885 95L879 86L885 77L883 67L891 58L901 60L910 54Z" fill="#FFFFFF"/>
    <circle cx="910" cy="86" r="15" fill="#1F83FF"/>
    <circle cx="910" cy="86" r="6" fill="#FFFFFF"/>

    <!-- app body -->
    <g transform="translate(0 140)">
      <!-- logo -->
      <rect x="430" y="86" width="164" height="164" rx="30" fill="#85CD3F"/>
      <rect x="502" y="122" width="20" height="92" rx="8" fill="#FFFFFF"/>
      <rect x="464" y="160" width="92" height="20" rx="8" fill="#FFFFFF"/>

      <text x="600" y="442" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="90" fill="#1E1E1E" font-weight="600">Sign In</text>
      <text x="600" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" fill="#8D8D8D">Let&apos;s experience the joy of telecare AI.</text>

      <text x="68" y="682" font-family="Inter, Arial, sans-serif" font-size="32" fill="#1E1E1E" font-weight="600">Email Address</text>
      <rect x="64" y="720" width="896" height="120" rx="26" fill="#FCFFF5" stroke="#8FCE3E" stroke-width="5"/>
      <rect x="100" y="766" width="42" height="30" rx="4" stroke="#9E9E9E" stroke-width="5" fill="none"/>
      <path d="M100 768L121 785L142 768" stroke="#9E9E9E" stroke-width="5" fill="none"/>
      <text x="184" y="797" font-family="Inter, Arial, sans-serif" font-size="31" fill="#202020">elementary221b@gmail.com</text>

      <text x="68" y="980" font-family="Inter, Arial, sans-serif" font-size="32" fill="#1E1E1E" font-weight="600">Password</text>
      <rect x="64" y="1018" width="896" height="120" rx="26" fill="#FAFAFA" stroke="#E1E1E1" stroke-width="5"/>
      <rect x="100" y="1062" width="30" height="40" rx="8" stroke="#9E9E9E" stroke-width="5" fill="none"/>
      <path d="M110 1062V1052C110 1042 118 1034 128 1034C138 1034 146 1042 146 1052V1062" stroke="#9E9E9E" stroke-width="5" fill="none"/>
      <text x="184" y="1094" font-family="Inter, Arial, sans-serif" font-size="31" fill="#B5B5B5">Enter your password...</text>
      <path d="M894 1070C924 1040 972 1040 1002 1070" stroke="#CFCFCF" stroke-width="8" stroke-linecap="round"/>
      <path d="M912 1038L986 1112" stroke="#CFCFCF" stroke-width="8" stroke-linecap="round"/>
      <circle cx="949" cy="1074" r="14" stroke="#CFCFCF" stroke-width="8" fill="none"/>

      <rect x="64" y="1292" width="896" height="120" rx="26" fill="#85CD3F"/>
      <text x="487" y="1368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="33" fill="#FFFFFF" font-weight="700">Sign In</text>
      <path d="M576 1350H620" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M607 1332L629 1350L607 1368" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

      <line x1="64" y1="1538" x2="415" y2="1538" stroke="#E4E4E4" stroke-width="4"/>
      <text x="600" y="1550" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" fill="#A0A0A0">or</text>
      <line x1="785" y1="1538" x2="1036" y2="1538" stroke="#E4E4E4" stroke-width="4"/>

      <g transform="translate(280 1620)">
        <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="4"/>
        <path d="M-6 -18H4V-2H18V8H4V28H-6V8H-20V-2H-6V-18Z" fill="#1E6AF3"/>
      </g>
      <g transform="translate(500 1620)">
        <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="4"/>
        <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="68" fill="#DB4437">G</text>
      </g>
      <g transform="translate(720 1620)">
        <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="4"/>
        <rect x="-20" y="-20" width="40" height="40" rx="10" stroke="#D7367A" stroke-width="5" fill="none"/>
        <circle cx="0" cy="0" r="12" stroke="#D7367A" stroke-width="5" fill="none"/>
        <circle cx="16" cy="-14" r="3" fill="#D7367A"/>
      </g>

      <text x="600" y="1890" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="31" fill="#777777">Don&apos;t have an account? <tspan fill="#8FCE3E" font-weight="600">Sign Up</tspan></text>
      <text x="600" y="1950" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="31" fill="#8FCE3E" font-weight="600">Forgot your password?</text>
    </g>
